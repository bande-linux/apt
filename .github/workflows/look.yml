name: look for releases
run-name: "${{ github.event_name == 'schedule' && 'Scheduled look for new releases' || 'Look for new releases' }}"

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: look
  cancel-in-progress: false

jobs:
  look:
    runs-on: ubuntu-24.04
    container: debian:forky
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - name: Install git, so the checkout carries the history
        run: |
          # gh is held out of forky by release-critical bugs, so it comes from unstable.
          printf 'Types: deb\nURIs: http://deb.debian.org/debian\nSuites: unstable\nComponents: main\nSigned-By: /usr/share/keyrings/debian-archive-keyring.pgp\n' \
              > /etc/apt/sources.list.d/unstable.sources
          printf 'Package: *\nPin: release a=unstable\nPin-Priority: 100\n' > /etc/apt/preferences.d/unstable
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git gh/unstable

      - name: Check out (actions/checkout v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install the tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          xargs apt-get install -y -qq --no-install-recommends < ci/packages

      - name: Find runs newer than the live archive, or a Valid-Until near its end, and start a publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APT_VERSION=$(scripts/build-repository-packages.sh --version) \
            scripts/find-runs.sh https://bande-linux.github.io/apt > runs
          if [ ! -s runs ]; then
            echo "Nothing new to publish" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat runs
          names=()
          while read -r repo id; do
            if [ "$repo" = resign ]; then
              [ "$id" != expired ] || echo "::warning::the live InRelease is past its Valid-Until; re-signing it"
              continue
            elif [ "$repo" = apt ]; then
              names+=("apt $id")
            else
              source=$repo
              case $source in dict | l10n) source=desktop ;; apps-l10n) source=apps ;; esac
              ref=$(gh api "repos/bande-linux/$source/actions/runs/$id" --jq '.head_branch // "?"') || ref='?'
              names+=("$repo $ref")
            fi
          done < runs
          # Only a Valid-Until near its end: the publish rebuilds and re-signs as it is.
          if [ ${#names[@]} -eq 0 ]; then
            title="Re-sign the archive"
          else
            title=$(IFS=,; echo "${names[*]}" | sed 's/,/, /g')
          fi
          jq -n --arg runs "$(paste -sd, runs)" --arg title "$title" \
            '{event_type: "publish", client_payload: {runs: $runs, title: $title}}' |
            gh api "repos/$GH_REPO/dispatches" --input -
          echo "Started a publish of $title" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delete earlier looks
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/tidy-runs.sh "${{ github.repository }}" look.yml "${{ github.run_id }}"
