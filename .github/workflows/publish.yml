name: publish

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: Repository of the run to publish (desktop, kernel or apps); empty finds new runs itself
        required: false
        type: string
        default: ''
      run_id:
        description: Its release run (desktop release.yml on a vX.Y.Z tag, kernel follow-debian.yml, apps build.yml on an <app>-vX.Y.Z tag)
        required: false
        type: string
        default: ''

permissions: {}

# Container jobs would default to sh; the steps are bash.
defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      runs: ${{ steps.find.outputs.runs }}
    steps:
      - name: Install git, so the checkout carries the history
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git

      - name: Check out (actions/checkout v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install the tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          xargs apt-get install -y -qq --no-install-recommends < ci/packages

      - name: Find runs newer than the live archive
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -n "$REPO$RUN_ID" ]; then
            if [ -z "$REPO" ] || [ -z "$RUN_ID" ]; then
              echo "::error::repo and run_id are given together"
              exit 1
            fi
            echo "$REPO $RUN_ID" > runs
          else
            APT_VERSION=$(scripts/build-repository-packages.sh --version) \
              scripts/find-runs.sh https://bande-linux.github.io/apt > runs
          fi
          if [ -s runs ]; then
            cat runs
            echo "runs=$(paste -sd, runs)" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new to publish"
          fi

  build:
    needs: find
    if: needs.find.outputs.runs != ''
    runs-on: ubuntu-24.04
    container: debian:trixie
    environment: apt-publish
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      refused: ${{ steps.fetch.outputs.refused }}
      desktop: ${{ steps.served.outputs.desktop }}
    steps:
      - name: Install git, so the checkout carries the history
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git

      - name: Check out (actions/checkout v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install the tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          xargs apt-get install -y -qq --no-install-recommends < ci/packages

      - name: Build the keyring and source packages
        run: scripts/build-repository-packages.sh debs-apt

      - name: Verify the runs and fetch their packages
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ needs.find.outputs.runs }}
        run: |
          set -o pipefail
          printf -- '--add-each\napt:main=debs-apt\n' > adds
          : > refused
          apps=()
          while read -r repo run; do
            [ "$repo" != apt ] || continue
            if [ "$repo" = apps ]; then
              apps+=("$run")
              if ! env -u GITHUB_OUTPUT scripts/fetch-run.sh apps "$run" debs-apps < /dev/null; then
                echo "::error::apps run $run is refused; it is marked as taken and left out"
                echo "apps $run" >> refused
              fi
              continue
            fi
            component=$(env -u GITHUB_OUTPUT scripts/fetch-run.sh "$repo" "$run" "debs-$repo" < /dev/null |
              sed -n 's/^component=//p')
            printf -- '--add\n%s:%s=debs-%s\n' "$repo" "$component" "$repo" >> adds
          done < <(tr , '\n' <<< "$RUNS")
          if compgen -G 'debs-apps/*.deb' > /dev/null; then
            printf -- '--add-each\napps:main=debs-apps\n' >> adds
          fi
          if [ ${#apps[@]} -gt 0 ]; then
            printf -- '--processed\napps=%s\n' "$(IFS=,; echo "${apps[*]}")" >> adds
          fi
          echo "refused=$(paste -sd, refused)" >> "$GITHUB_OUTPUT"

      - name: Restore the pool cache (actions/cache v6)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: pool-cache
          key: pool-${{ github.run_id }}
          restore-keys: pool-

      - name: Rebuild and sign the archive
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          mapfile -t adds < adds
          scripts/rebuild.sh --live https://bande-linux.github.io/apt "${adds[@]}" \
            --out public --cache pool-cache
          gpgconf --kill all
          rm -rf "$GNUPGHOME"

      - name: Name the desktop version the site serves
        id: served
        run: |
          version=$(awk -v RS= '$0 ~ "(^|\n)Package: bande-desktop\n"' public/dists/rolling/main/binary-amd64/Packages |
            sed -n 's/^Version: //p')
          echo "bande-desktop ${version:-is not in the archive yet}"
          echo "desktop=$version" >> "$GITHUB_OUTPUT"

      - name: Upload the site (actions/upload-pages-artifact v5)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public

      - name: Keep the repository packages for the bootstrap release (actions/upload-artifact v7)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repository-packages
          path: |
            debs-apt/bande-archive-keyring_*_all.deb
            debs-apt/bande-apt-source_*_all.deb
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    container: debian:trixie
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy (actions/deploy-pages v5)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  release:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - name: Check out (actions/checkout v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates dpkg gh

      - name: Fetch the repository packages (actions/download-artifact v8)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: repository-packages
          path: debs

      - name: Create the bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/bootstrap-release.sh debs

  verify:
    needs: [build, deploy]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: debian:testing
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the repository packages from the live archive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl gpg
          gpg --batch --dearmor < conf/archive-key.asc > /tmp/archive.gpg
          curl -fsSL https://bande-linux.github.io/apt/key.asc | gpg --batch --dearmor > /tmp/live.gpg
          cmp /tmp/archive.gpg /tmp/live.gpg
          printf 'Types: deb\nURIs: https://bande-linux.github.io/apt\nSuites: rolling\nComponents: main\nSigned-By: /tmp/archive.gpg\n' \
            > /etc/apt/sources.list.d/bootstrap.sources
          for attempt in 1 2 3 4 5; do
            apt-get update -o APT::Update::Error-Mode=any && apt-get install -y bande-archive-keyring bande-apt-source && break
            [ "$attempt" != 5 ] || exit 1
            echo "Pages may still serve the previous site; trying again in a minute"
            sleep 60
          done
          rm /etc/apt/sources.list.d/bootstrap.sources
          apt-get update -o APT::Update::Error-Mode=any
          apt-cache policy bande-archive-keyring bande-os-apple

      - name: Install the desktop just published and check it is this architecture's build
        if: needs.build.outputs.desktop != ''
        env:
          VERSION: ${{ needs.build.outputs.desktop }}
        run: |
          architecture=$(dpkg --print-architecture)
          for attempt in 1 2 3 4 5; do
            served=$(apt-cache show --no-all-versions bande-desktop 2>/dev/null | sed -n 's/^Version: //p' || true)
            [ "$served" != "$VERSION" ] || break
            if [ "$attempt" = 5 ]; then
              echo "::error::the site serves bande-desktop ${served:-none}, the publish built $VERSION"
              exit 1
            fi
            echo "Pages serves bande-desktop ${served:-none} yet; trying again in a minute"
            sleep 60
            apt-get update -qq -o APT::Update::Error-Mode=any
          done
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends bande-desktop
          wrong=$(dpkg-query -W -f '${db:Status-Status} ${Package} ${Architecture} ${Version}\n' 'bande-*' |
            awk -v a="$architecture" -v v="$VERSION" '$1 == "installed" && $2 != "bande-archive-keyring" &&
              $2 != "bande-apt-source" && (($3 != a && $3 != "all") || $4 != v)')
          if [ -n "$wrong" ]; then
            echo "::error::installed packages that are not $architecture or all at $VERSION: $wrong"
            exit 1
          fi
          [ "$(dpkg-query -W -f '${Architecture} ${Version}' bande-compositor)" = "$architecture $VERSION" ]
          [ "$(dpkg-query -W -f '${Architecture} ${Version}' xdg-desktop-portal-bande)" = "$architecture $VERSION" ]
          runtime=$(mktemp -d)
          status=0
          XDG_RUNTIME_DIR=$runtime timeout 10 bande-compositor --headless > compositor.out 2>&1 || status=$?
          cat compositor.out
          [ "$status" = 124 ]
          grep -q '^WAYLAND_DISPLAY=wayland-' compositor.out

      - name: Check every package bande-desktop recommends has a candidate here or in Debian
        if: needs.build.outputs.desktop != ''
        run: |
          missing=$(apt-cache show --no-all-versions bande-desktop | sed -n 's/^Recommends: //p' | tr ',' '\n' |
            sed 's/^ *//; s/[ (|].*//' | while read -r package; do
              candidate=$(apt-cache policy "$package" | sed -n 's/^ *Candidate: //p')
              [ -n "$candidate" ] && [ "$candidate" != "(none)" ] || echo "$package"
            done | xargs)
          [ -z "$missing" ] || echo "::warning::bande-desktop recommends packages that neither the archive nor Debian testing has: $missing"

  report:
    needs: [build, deploy]
    if: needs.build.outputs.refused != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Refused runs
        env:
          REFUSED: ${{ needs.build.outputs.refused }}
        run: |
          echo "::error::published without these refused runs: $REFUSED; see the build job's log"
          exit 1
