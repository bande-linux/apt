name: publish

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: Repository of the run to publish (desktop or kernel); empty finds new runs itself
        required: false
        type: string
        default: ''
      run_id:
        description: Its release run (desktop release.yml on a vX.Y.Z tag, kernel follow-debian.yml)
        required: false
        type: string
        default: ''
      initial:
        description: The site holds no archive yet (first publish only)
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      runs: ${{ steps.find.outputs.runs }}
    steps:
      - name: Check out (actions/checkout v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the tools
        run: |
          apt-get update -qq
          xargs apt-get install -y -qq --no-install-recommends < ci/packages

      - name: Find runs newer than the live archive
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -n "$REPO$RUN_ID" ]; then
            if [ -z "$REPO" ] || [ -z "$RUN_ID" ]; then
              echo "::error::repo and run_id are given together"
              exit 1
            fi
            echo "$REPO $RUN_ID" > runs
          else
            scripts/find-runs.sh https://bande-linux.github.io/apt > runs
          fi
          if [ -s runs ]; then
            cat runs
            echo "runs=$(paste -sd, runs)" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new to publish"
          fi

  build:
    needs: find
    if: needs.find.outputs.runs != ''
    runs-on: ubuntu-24.04
    container: debian:trixie
    environment: apt-publish
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      bootstrap: ${{ steps.packages.outputs.bootstrap }}
    steps:
      - name: Check out (actions/checkout v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the tools
        run: |
          apt-get update -qq
          xargs apt-get install -y -qq --no-install-recommends < ci/packages

      - name: Verify the runs and fetch their packages
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ needs.find.outputs.runs }}
        run: |
          set -o pipefail
          : > adds
          tr , '\n' <<< "$RUNS" | while read -r repo run; do
            component=$(env -u GITHUB_OUTPUT scripts/fetch-run.sh "$repo" "$run" "debs-$repo" < /dev/null |
              sed -n 's/^component=//p')
            printf -- '--add\n%s=debs-%s\n' "$component" "$repo" >> adds
          done

      - name: Restore the pool cache (actions/cache v6)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: pool-cache
          key: pool-${{ github.run_id }}
          restore-keys: pool-

      - name: Rebuild and sign the archive
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          INITIAL: ${{ inputs.initial }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          mapfile -t adds < adds
          initial=()
          [ "$INITIAL" != true ] || initial=(--initial)
          scripts/rebuild.sh --live https://bande-linux.github.io/apt "${adds[@]}" \
            --out public --cache pool-cache "${initial[@]}"
          gpgconf --kill all
          rm -rf "$GNUPGHOME"

      - name: Upload the site (actions/upload-pages-artifact v5)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public

      - name: Find the repository packages
        id: packages
        run: |
          if ls debs-desktop/bande-apt-source_*_all.deb > /dev/null 2>&1; then
            echo bootstrap=true >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the repository packages for the bootstrap release (actions/upload-artifact v7)
        if: steps.packages.outputs.bootstrap == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repository-packages
          path: |
            debs-desktop/bande-archive-keyring_*_all.deb
            debs-desktop/bande-apt-source_*_all.deb
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    container: debian:trixie
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy (actions/deploy-pages v5)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  release:
    needs: [build, deploy]
    if: needs.build.outputs.bootstrap == 'true'
    runs-on: ubuntu-24.04
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - name: Check out (actions/checkout v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates dpkg gh

      - name: Fetch the repository packages (actions/download-artifact v8)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: repository-packages
          path: debs

      - name: Create the bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/bootstrap-release.sh debs
