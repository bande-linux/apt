name: publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Desktop CI run whose packages to publish
        required: true
        type: string
      tag:
        description: vX.Y.Z to publish to the release channel; empty publishes to testing
        required: false
        type: string
        default: ''
      initial:
        description: The site holds no archive yet (first publish only)
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  approve:
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    container: debian:trixie
    environment: apt-stable-approval
    steps:
      - name: Approved for the release channel
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: echo "Publishing $TAG from desktop run $RUN_ID to the release channel"

  build:
    needs: approve
    if: ${{ !cancelled() && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: ubuntu-24.04
    container: debian:trixie
    environment: apt-publish
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      bootstrap: ${{ steps.packages.outputs.bootstrap }}
    steps:
      - name: Check out (actions/checkout v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the tools
        run: |
          apt-get update -qq
          xargs apt-get install -y -qq --no-install-recommends < ci/packages

      - name: Token for the desktop repository (actions/create-github-app-token v3)
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.DESKTOP_READER_CLIENT_ID }}
          private-key: ${{ secrets.DESKTOP_READER_KEY }}
          owner: unbound-linux
          repositories: desktop
          permission-actions: read
          permission-contents: read

      - name: Verify the run and fetch its packages
        id: fetch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: scripts/fetch-run.sh "$RUN_ID" debs ${TAG:+"$TAG"}

      - name: Restore the pool cache (actions/cache v6)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: pool-cache
          key: pool-${{ github.run_id }}
          restore-keys: pool-

      - name: Rebuild and sign the archive
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          CHANNEL: ${{ steps.fetch.outputs.channel }}
          INITIAL: ${{ inputs.initial }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          initial=()
          [ "$INITIAL" != true ] || initial=(--initial)
          scripts/rebuild.sh --live https://unbound-linux.github.io/apt --channel "$CHANNEL" \
            --debs debs --out public --cache pool-cache "${initial[@]}"
          gpgconf --kill all
          rm -rf "$GNUPGHOME"

      - name: Upload the site (actions/upload-pages-artifact v5)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public

      - name: Find the repository packages
        id: packages
        run: |
          if ls debs/unbound-apt-source_*_all.deb > /dev/null 2>&1; then
            echo bootstrap=true >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the repository packages for the bootstrap release (actions/upload-artifact v7)
        if: steps.packages.outputs.bootstrap == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repository-packages
          path: |
            debs/unbound-archive-keyring_*_all.deb
            debs/unbound-apt-source_*_all.deb
            debs/unbound-apt-source-testing_*_all.deb
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    container: debian:trixie
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy (actions/deploy-pages v5)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  release:
    needs: [build, deploy]
    if: needs.build.outputs.bootstrap == 'true'
    runs-on: ubuntu-24.04
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - name: Check out (actions/checkout v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates dpkg gh

      - name: Fetch the repository packages (actions/download-artifact v8)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: repository-packages
          path: debs

      - name: Create the bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/bootstrap-release.sh debs
